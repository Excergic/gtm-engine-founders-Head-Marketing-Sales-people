followups:
  pending_days: 7
  proposal_days: 5
  outreach_days: 4
pipelines:
  consulting_client: [identified, qualified, contacted, engaged, discovery_scheduled, discovery_completed, proposal_sent, negotiation, won, lost, nurture]
  remote_job: [identified, role_researched, contacted, replied, application_submitted, interview_scheduled, interviewing, offer, hired, rejected, nurture]
  closed: [won, lost, hired, rejected]
# Canonical field -> accepted input headers (case-insensitive). Every canonical field
# must exist on the Pydantic Prospect model (src/gtm/models.py); config load fails
# otherwise. Values are validated there: URLs, LinkedIn /in/ profiles, X handles,
# signal_date as YYYY-MM-DD and not in the future.
mappings:
  # The Grok contract: exactly the 13 columns in docs/grok-brief.md.
  # Rows missing signal, signal_date, or source_url are captured but flagged for review.
  grok:
    full_name: [name]
    job_title: [title]
    company_name: [company]
    website: [company_website]
    country: [country]
    city: [city]
    linkedin_url: [linkedin_url]
    x_handle: [x_handle, x-handle]
    source_url: [source_url, source-url]
    signal: [signal]
    signal_date: [signal_date, signal-date]
    why_fit: [why_fit, why-fit]
    outreach_angle: [outreach_angle, outreach-angle]
  # Authorized LinkedIn exports and manual capture.
  linkedin:
    full_name: [name, full name]
    email: [email address]
    linkedin_url: [url, linkedin profile url]
    company_name: [company]
    website: [company website, company_website]
    domain: [company domain]
    job_title: [position, job title]
    discovered_at: [discovery date]
    connection_status: [status]
    connection_request_at: [connection request date]
    last_contact_at: [last contact date]
    next_followup_at: [next follow-up date]
    objective: [campaign]
    create_opportunity: [create_opportunity]
    opportunity_stage: [opportunity_stage]
    notes: [notes]
# Legacy CSV-tracker scoring (gtm score). Kept for the old commands; the warehouse uses
# the `icp:` block below. The profile now describes the sales ICP, not the old job search.
scoring:
  model_version: technical-marketing-v1
  profile:
    goal: book_calls_with_icp_buyers
    positioning: GTM engineering for B2B SaaS founders and marketing, content and sales leaders
    target_roles: [Founder, Co-founder, CEO, CMO, CRO, Chief Growth Officer, Chief Content Officer, Chief Commercial Officer, VP or Head of Marketing, Sales, Content, Growth, Demand, Revenue, GTM]
    technical_work: [outbound systems, enrichment pipelines, CRM engineering, workflow automation, marketing systems]
    exclude_roles: [individual contributors, Directors and below, SDRs, AEs, investors]
    strategy_preference: technical_execution_over_business_strategy
    work_location: unspecified
    remote_requirement: not applicable (selling, not job seeking)
    skill_evidence_urls: []
  research_max_age_days: 30
  engagement_max_age_days: 30
  tier1_min: 70
  tier2_min: 40
  weights:
    account_fit: {strong: 40, moderate: 20, weak: 0}
    lead_fit: {decision_maker: 10, relevant: 5, other: 0}
    intent: {strong: 30, moderate: 15, none: 0}
    engagement: {positive_reply: 20, replied: 15, connected: 10, none: 0}
  # ICP: founders plus Head-level and C-suite leaders in marketing, content, and sales.
  decision_maker_titles: [founder, ceo, chief executive, president, chief marketing, cmo, chief revenue, cro, chief sales, chief growth, chief content, chief commercial, chief customer, vp of marketing, vp marketing, vice president of marketing, vp of sales, vp sales, vice president of sales, vp of content, vp content, vp of growth, vp growth, vp demand, vp revenue, head of marketing, head of sales, head of content, head of growth, head of demand, head of revenue, head of gtm, head of go-to-market, hiring manager]
  # Seniority x function rule catches variants like "SVP Global Sales" or "VP of Product Marketing".
  decision_maker_rule:
    seniority: [vp, svp, evp, vice president, head, chief]
    function: [marketing, sales, content, growth, revenue, demand, brand, gtm, go-to-market, commercial, communications]
    seniority_alone: [cmo, cro, cco, cgo, cco & partner]
    exclude: [intern, assistant, associate, coordinator, analyst]
  relevant_titles: [marketing, growth, content, sales, revenue operations, revops, demand, brand, recruiter, talent]
# ICP scoring for the warehouse (gtm icp score / gtm icp ready). Components add to 100;
# a component with no evidence stays unscored (null), never guessed.
icp:
  model_version: icp-v1
  tier1_min: 70
  tier2_min: 40
  weights:
    lead_fit: 40        # title is in the ICP (founder segment or GTM leader)
    intent: 30          # signal is fresh and is a qualifying kind of signal
    account_fit: 20     # company stage / fit from ICP account research (not built yet)
    engagement: 10      # connected or replied
  signal_max_age_days: 30
  founder_titles: [founder, co-founder, cofounder, ceo, chief executive]
  # GTM leaders use scoring.decision_maker_titles + scoring.decision_maker_rule above.
  # Outside the ICP even when a GTM word appears in the title.
  exclude_titles: [director, manager, intern, assistant, associate, coordinator, analyst, sdr, bdr, account executive, investor, venture partner]
  # ICP signals: funding, launch, first GTM hire, new in role, team expansion, job post, outbound pain.
  qualifying_signals: [posted, returned, rejoined, started, added, adding, raised, raise, raises, funding, investment, invested, seed, series, stealth, launch, launched, launches, hiring, hire, hired, hires, open roles, job post, new, first, joined, joins, appointed, promoted, named, expansion, expanding, scaling, growing, outbound, pipeline]
  ready:
    tiers: [tier_1, tier_2]
    # Ready also needs: golden, verified email, not do-not-contact, lead_status open,
    # a fresh signal, an outreach angle, and a source URL the angle can cite.

# Enrichment waterfall: each stage asks providers in order, only for people still missing
# that field. Add a provider: write an adapter in src/gtm/enrichers/, register it, list it here.
enrichment:
  waterfall:
    linkedin_url: [clay, deepline]
    email: [clay, deepline]
    verify: [deepline]
  providers:
    clay:
      adapter: clay_results          # Clay runs via the Claude connection; results saved as JSON
      results_dir: enrichment/clay
    deepline:
      adapter: deepline              # deepline CLI; credits are charged per call
      linkedin_play: prebuilt/person-to-linkedin-harvestapi
      email_play: prebuilt/person-to-email
      verify_tool: bounceban_verify_single
      timeout_seconds: 300
    manual:
      adapter: manual
      results_dir: enrichment/manual
