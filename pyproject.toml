[project]
name = "personal-gtm-os"
version = "0.2.0"
description = "GTM engine: signal-based prospecting of B2B SaaS founders and marketing, content and sales leaders"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "typer>=0.12,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
gtm = "gtm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/gtm"]
